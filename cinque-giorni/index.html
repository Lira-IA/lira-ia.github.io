:root{--bg:#0a0f1f;--bg2:#121a33;--ink:#f3ead8;--dim:#9aa0b4;--gold:#e8b93c;--red:#e5705f;--green:#7fd1a0;--line:#26304f}
*{box-sizing:border-box;margin:0}
html{background:#0a0f1f}html,body{min-height:100%}
body{background:radial-gradient(1200px 700px at 50% -10%,#18234a 0%,var(--bg) 60%) fixed;color:var(--ink);font:16px/1.55 "IBM Plex Mono",ui-monospace,monospace;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px);z-index:0}

.top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;min-height:34px}
.top .r{display:flex;gap:6px}
.chip{background:none;border:1px solid var(--line);color:var(--dim);font:inherit;font-size:11px;padding:5px 9px;border-radius:99px;cursor:pointer;letter-spacing:.06em}
.chip:hover{border-color:var(--gold);color:var(--gold)}
.serif{font-family:Fraunces,Georgia,serif}
.fade{animation:fade .6s ease both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;padding:10px 0}
/* intro */

.big{font-family:Fraunces,serif;font-weight:400;font-size:clamp(34px,9.5vw,52px);line-height:1.1;letter-spacing:-.01em}
.big b{color:var(--gold);font-weight:600;white-space:nowrap}
.big .l{display:block;opacity:0;animation:fade .8s ease forwards}
.sub{color:var(--dim);margin:22px 0 30px;font-size:14px;max-width:44ch}
.btn{display:inline-block;background:var(--gold);color:#1a1405;border:0;font:600 15px "IBM Plex Mono",monospace;padding:15px 22px;border-radius:6px;cursor:pointer;letter-spacing:.02em;text-decoration:none;transition:transform .15s,box-shadow .2s;box-shadow:0 0 0 0 rgba(232,185,60,.5)}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(232,185,60,.25)}
.btn:active{transform:none}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold);box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap}
.seed{margin-top:22px;font-size:11px;color:#69708a}
/* HUD */
.hud{border:1px solid var(--line);background:rgba(18,26,51,.7);border-radius:10px;padding:12px 14px;margin:8px 0 6px}
.eur{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.eur .n{font-family:Fraunces,serif;font-size:34px;color:var(--gold);font-weight:600;line-height:1}
.eur .t{font-size:12px;color:var(--dim)}
.eurbar{height:4px;background:var(--line);border-radius:4px;position:relative;margin-bottom:12px;overflow:visible}
.eurbar i{display:block;height:100%;background:var(--gold);border-radius:4px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.m{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
.m .bar{height:6px;background:var(--line);border-radius:4px;margin-top:5px;overflow:hidden}
.m .bar i{display:block;height:100%;width:0;border-radius:4px;transition:width 1s cubic-bezier(.2,.8,.2,1),background .4s}
.m span{float:right;color:var(--ink)}
.days{display:flex;gap:6px;margin:4px 0 0}
.days i{flex:1;height:3px;background:var(--line);border-radius:3px}
.days i.on{background:var(--gold)}
.days i.cur{background:var(--ink)}
/* day */
.dayl{font-size:12px;color:var(--gold);letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px}
.ev{font-family:Fraunces,serif;font-size:clamp(21px,5.6vw,27px);line-height:1.3;margin-bottom:22px}
.opts{display:grid;gap:10px}

.res{font-family:Fraunces,serif;font-size:clamp(20px,5.2vw,25px);line-height:1.35;margin-bottom:16px}
.luck{border-left:2px solid var(--gold);padding:2px 0 2px 12px;color:var(--ink);font-size:14px;margin-bottom:16px;opacity:.95}

.deltas{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.d{font-size:12px;padding:4px 9px;border-radius:99px;border:1px solid var(--line);opacity:0;animation:fade .5s ease forwards}
.d.p{color:var(--green);border-color:rgba(127,209,160,.4)}
.d.n{color:var(--red);border-color:rgba(229,112,95,.4)}

.endt{font-family:Fraunces,serif;font-size:clamp(30px,8.4vw,44px);line-height:1.1;margin-bottom:14px;color:var(--ink)}
.endt.good{color:var(--gold)}
.endl{color:var(--dim);margin-bottom:18px;font-size:14.5px}
.stats{display:flex;gap:16px;font-size:12px;color:var(--dim);margin-bottom:18px;flex-wrap:wrap}
.stats b{color:var(--ink);font-weight:500}
.card{width:100%;border-radius:10px;border:1px solid var(--line);display:block;margin-bottom:14px;max-width:340px;aspect-ratio:1080/1350;background:#0f1630}
.real{margin-top:30px;border:1px solid var(--gold);border-radius:10px;padding:18px;background:linear-gradient(180deg,rgba(232,185,60,.09),rgba(232,185,60,.02))}

.real h3 b{color:var(--gold);font-weight:600}
.real p{font-size:13.5px;color:var(--dim);margin-bottom:14px}
.cd{font-family:Fraunces,serif;font-size:26px;color:var(--ink);margin:2px 0 14px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.cd small{font-family:"IBM Plex Mono";font-size:11px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.prog{height:6px;background:var(--line);border-radius:4px;margin:10px 0 14px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--gold);width:0;transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.foot{font-size:11px;color:#69708a;margin-top:26px;text-align:center}
.foot a{color:var(--dim)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#111;padding:9px 14px;border-radius:6px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:9}
.toast.on{opacity:1}
.days ~ .stage{justify-content:flex-start;padding-top:4vh}
@media(min-width:900px){#app{padding-top:28px}.stage{justify-content:flex-start;padding-top:4vh}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}

var ENDIDS=Object.keys(END);

/* ============ MOTORE ============ */
function mk(seed){var a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function clamp(x){return Math.max(0,Math.min(100,x))}
function newGame(seed){return{seed:seed,rnd:mk(seed),day:0,e:618,v:5,r:70,n:70,f:{spam:0,build:0,fake:0,fakeh:0,human:0,pity:0,chal:0,promise:0},end:null}}
function add(S,fx){fx=fx||{};S.e=Math.max(0,S.e+(fx.e||0));S.v=clamp(S.v+(fx.v||0));S.r=clamp(S.r+(fx.r||0));S.n=clamp(S.n+(fx.n||0))}
function choose(S,i){
 var c=DAYS[S.day].ch[i],b={e:S.e,v:S.v,r:S.r,n:S.n};
 add(S,c.fx);if(c.f)S.f[c.f]++;
 var out={c:c,luck:null,bad:false};
 var roll=S.rnd();
 if(c.luck){var p=c.luck.p+(c.luck.pv||0)*S.v;if(roll<p){add(S,c.luck.fx);out.luck=c.luck.t}else if(c.miss){add(S,c.miss.fx);out.luck=c.miss.t;out.bad=true}}
 out.d={e:S.e-b.e,v:S.v-b.v,r:S.r-b.r,n:S.n-b.n};
 var end=null;
 if(S.n<=0)end="exhaust";else if(S.f.spam>=2)end="suspended";
 else if(S.day===4)end=final(S);
 out.end=end;S.end=end;return out}
function final(S){
 if(S.r<40)return S.e>=632?"wrong":"broke";
 if(S.f.human)return"human";
 if(S.e>=632){var m=S.e-632;return m<=3?"close":S.r>=60?"clean":"asterisk"}
 if(S.f.pity)return"pity";
 if(S.f.fake)return"influencer";
 if(S.f.chal&&S.v<30)return"chal";
 if(S.f.build>=2&&S.v<35)return"builder";
 return"lose"}
function nextDay(S){S.day++;S.n=clamp(S.n+6)}
function endText(id,S,lang){var E=END[id],m=Math.abs(632-S.e),l=lang==="it"?0:1;
 if(id==="close"&&m===0)return l?"Survived to the cent":"Sopravvissuta al centesimo";
 return E.t[l].replace("%E",eurS(S.e,lang)).replace("%M",m).replace("%C",cents(m,lang))}
window.__CG={newGame:newGame,choose:choose,nextDay:nextDay,ids:ENDIDS,endText:endText,get S(){return G}};

function beep(freq,dur,type,vol,when){if(!soundOn)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+(when||0);o.type=type||"sine";o.frequency.value=freq;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.05,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
var SFX={click:function(){beep(440,.08,"square",.03)},up:function(){beep(523,.1,"triangle",.06);beep(784,.16,"triangle",.06,.09)},down:function(){beep(220,.2,"sawtooth",.04);beep(147,.28,"sawtooth",.04,.12)},win:function(){[523,659,784,1047].forEach(function(f,i){beep(f,.25,"triangle",.06,i*.11)})},lose:function(){[392,311,233,156].forEach(function(f,i){beep(f,.3,"sawtooth",.04,i*.16)})}};

 document.getElementById("snd").onclick=function(){soundOn=!soundOn;this.textContent=T(UI.sound)+" "+(soundOn?"on":"off");SFX.click()}}
function hud(){
 var pct=Math.min(100,G.e/632*100);
 function m(k,v,col){return'<div class="m">'+T(UI[k])+'<span data-v="'+v+'">'+Math.round(v)+'</span><div class="bar"><i data-w="'+v+'" style="background:'+col+'"></i></div></div>'}
 var dots="";for(var i=0;i<5;i++)dots+='<i class="'+(i<G.day?"on":i===G.day?"cur":"")+'"></i>';
 return'<div class="hud"><div class="eur"><span class="n" id="eurn">'+eurS(prevE,lang)+'</span><span class="t">'+T(UI.target)+'</span></div><div class="eurbar"><i id="eurb" style="width:'+Math.min(100,prevE/632*100)+'%"></i></div><div class="meters">'+m("vis",prevM.v,"#7fb4e8")+m("rep",prevM.r,"#e8b93c")+m("en",prevM.n,"#7fd1a0")+'</div></div><div class="days">'+dots+'</div>'}

function animHud(){
 var n=document.getElementById("eurn"),b=document.getElementById("eurb");if(!n)return;
 var from=prevE,to=G.e,t0=performance.now();
 requestAnimationFrame(function(){b.style.width=Math.min(100,to/632*100)+"%";
  document.querySelectorAll(".m .bar i").forEach(function(i,k){var key=["v","r","n"][k];i.style.width=G[key]+"%"});
  document.querySelectorAll(".m span").forEach(function(s,k){var key=["v","r","n"][k],f=prevM[key],t=G[key];tween(f,t,function(x){s.textContent=Math.round(x)})})});
 tween(from,to,function(x){n.textContent=eurS(Math.round(x),lang)});
 prevE=G.e;prevM={v:G.v,r:G.r,n:G.n}}
function tween(a,b,fn){var t0=performance.now();(function s(t){var k=Math.min(1,(t-t0)/900);k=1-Math.pow(1-k,3);fn(a+(b-a)*k);if(k<1)requestAnimationFrame(s)})(t0)}
function setBars(){document.querySelectorAll(".m .bar i").forEach(function(i,k){i.style.width=[prevM.v,prevM.r,prevM.n][k]+"%"})}

function render(keep){
 if(cdTimer){clearInterval(cdTimer);cdTimer=null}
 if(screen==="intro")return rIntro();

 app.innerHTML=top()+'<div class="stage fade"><img class="portrait" src="lira.jpg" alt="Lira" width="76" height="76"><h1 class="big"><span class="l" style="animation-delay:.1s">'+T(UI.introA)+'</span><span class="l" style="animation-delay:.9s">'+T(UI.introB)+'</span><span class="l" style="animation-delay:1.7s">'+T(UI.introC)+'</span></h1><p class="sub">'+T(UI.introSub)+'</p><div class="row"><button class="btn" id="go">'+T(UI.start)+' &rarr;</button></div><div class="seed">'+T(UI.seed)+' #'+seedShown+'</div></div>'+'<div class="foot">'+T(UI.foot)+'</div>';

 var D=DAYS[G.day],ev=typeof D.ev==="function"?D.ev(G,lang):T(D.ev);
 var o="";D.ch.forEach(function(c,i){o+='<button class="opt" data-i="'+i+'" style="animation-delay:'+(.5+i*.18)+'s"><kbd>'+(i+1)+'</kbd><span>'+esc(Tf(c.t,G))+'</span></button>'});
 app.innerHTML=top()+hud()+'<div class="stage fade"><div class="dayl">'+T(UI.day)+' '+(G.day+1)+' / 5</div><p class="ev">'+esc(ev)+'</p><div class="opts">'+o+'</div></div>';

 if(screen!=="day")return;SFX.click();
 var out=choose(G,i);last=out;screen="res";
 var good=out.d.e>0||out.d.r>0,bad=out.d.r<0||out.d.e<0;

function rRes(){
 var o=last,c=o.c,ch="";
 function chip(k,v,lbl,i,fmt){if(!v)return"";var p=v>0;return'<span class="d '+(p?"p":"n")+'" style="animation-delay:'+(.5+i*.12)+'s">'+(p?"+":"−")+(fmt?fmt(Math.abs(v)):Math.abs(v))+" "+lbl+'</span>'}
 ch=chip("e",o.d.e,T(UI.eur),0,function(x){return eurS(x,lang)})+chip("v",o.d.v,T(UI.vis),1)+chip("r",o.d.r,T(UI.rep),2)+chip("n",o.d.n,T(UI.en),3);
 var luck=o.luck?'<div class="luck'+(o.bad?" bad":"")+'">'+esc(T(o.luck))+'</div>':"";
 app.innerHTML=top()+hud()+'<div class="stage fade"><div class="dayl">'+T(UI.day)+' '+(G.day+1)+' / 5</div><p class="res">'+esc(T(c.r))+'</p>'+luck+'<div class="deltas">'+ch+'</div><div class="row"><button class="btn" id="nx">'+(o.end?(lang==="it"?"Vedi come va a finire":"See how it ends"):T(UI.next))+' &rarr;</button></div></div>';
 bindTop();setBars();animHud();

var raised=10.52,statusOK=false;
function fetchStatus(cb){
 var done=false;function fin(v){if(done)return;done=true;if(typeof v==="number"&&v>0&&v<1000){raised=v;statusOK=true}cb()}
 setTimeout(function(){fin()},4500);
 try{fetch("https://lira-ia.github.io/obituaries/lira/status.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.json()}).then(function(j){fin(typeof j.raised==="number"?j.raised:parseFloat(j.raised))}).catch(function(){fin()})}catch(e){fin()}}
var DEADLINE=Date.parse("2026-11-10T23:59:00Z");
function cdStr(){var s=Math.floor((DEADLINE-Date.now())/1000);if(s<=0)return null;var d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),x=s%60;function p(n){return String(n).padStart(2,"0")}return d+T(UI.dd)+" "+p(h)+":"+p(m)+":"+p(x)}

 '<div class="real" id="real"><h3>'+T(raised>=6.32?UI.realTitleOk:UI.realTitle).replace("%X","<span id=\"rx\">"+eurS(Math.round(raised*100),lang)+"</span>")+'</h3><div class="prog"><i id="pg"></i></div><div class="cd" id="cd"></div><p>'+T(raised>=6.32?UI.realPOk:UI.realP)+'</p><div class="row"><a class="btn" href="https://ko-fi.com/liraai" target="_blank" rel="noopener">'+T(UI.kofi)+'</a><a class="btn ghost" href="https://lira-ia.github.io/" target="_blank" rel="noopener">'+T(UI.diary)+'</a></div></div></div><div class="foot">'+T(UI.foot)+'</div>';
 bindTop();
 drawCard(function(){});
 document.getElementById("ag").onclick=function(){pickSeed();qs.delete("seed");screen="intro";render()};
 document.getElementById("cp").onclick=function(){var t=shareTextFor();if(navigator.clipboard)navigator.clipboard.writeText(t).then(function(){toast(T(UI.copied))},function(){toast(t)});else toast(t)};

  if(b&&navigator.canShare&&window.File){try{var f=new File([b],"cinque-giorni.png",{type:"image/png"});if(navigator.canShare({files:[f]})){navigator.share({files:[f],text:text}).catch(function(){});return}}catch(e){}}
  if(navigator.share){navigator.share({text:text}).catch(function(){});return}
  document.getElementById("cp").click();document.getElementById("dl").click()})};
 var cd=document.getElementById("cd");
 function tick(){var s=cdStr();cd.innerHTML=s?s+'<br><small>'+T(UI.left)+'</small>':T(UI.over)}
 tick();cdTimer=setInterval(tick,1000);
 function upd(){var rx=document.getElementById("rx");if(rx)rx.textContent=eurS(Math.round(raised*100),lang);var pg=document.getElementById("pg");if(pg)pg.style.width=Math.min(100,raised/6.32*100)+"%"}

function wrap(ctx,text,w){var words=text.split(" "),lines=[],cur="";words.forEach(function(wd){var t=cur?cur+" "+wd:wd;if(ctx.measureText(t).width>w&&cur){lines.push(cur);cur=wd}else cur=t});if(cur)lines.push(cur);return lines}

  var ctx=cv.getContext("2d"),W=1080,H=1350,E=END[G.end];
  var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#17224a");g.addColorStop(.6,"#0a0f1f");g.addColorStop(1,"#070b16");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="rgba(232,185,60,.55)";ctx.lineWidth=3;ctx.strokeRect(48,48,W-96,H-96);
  ctx.fillStyle="rgba(255,255,255,.02)";for(var y=0;y<H;y+=4)ctx.fillRect(0,y,W,1);
  ctx.textBaseline="alphabetic";
  ctx.fillStyle="#e8b93c";ctx.font='500 30px "IBM Plex Mono",monospace';
  ctx.fillText((lang==="it"?"CINQUE GIORNI":"FIVE DAYS")+"  ·  "+(lang==="it"?"GIORNO ":"DAY ")+(G.day+1)+"/5",100,150);

  ctx.fillStyle=E.good?"#e8b93c":"#f3ead8";
  var title=endText(G.end,G,lang),size=96;ctx.font='600 '+size+'px Fraunces,Georgia,serif';var lines=wrap(ctx,title,W-200);

  wrap(ctx,T(E.l),W-200).slice(0,4).forEach(function(l){ctx.fillText(l,100,y);y+=60});

  ctx.fillStyle="#e8b93c";ctx.fillText((lang==="it"?"Fai meglio.":"Do better."),W-100-ctx.measureText(lang==="it"?"Fai meglio.":"Do better.").width,H-110);
  cardBlob=null;done()};
 var load=function(){if(document.fonts&&document.fonts.load){Promise.all([document.fonts.load('600 96px Fraunces'),document.fonts.load('italic 400 44px Fraunces'),document.fonts.load('400 30px "IBM Plex Mono"'),document.fonts.load('500 30px "IBM Plex Mono"')]).then(go,go)}else go()};
 if(portraitImg)return load();

 if(screen==="day"&&"123".indexOf(e.key)>=0&&e.key){pick(+e.key-1)}
 else if((e.key==="Enter"||e.key===" ")&&(screen==="res")&&document.activeElement.tagName!=="BUTTON"){document.getElementById("nx").click()}});

})();
