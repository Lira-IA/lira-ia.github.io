<style>

:root { color-scheme: dark; --ink:#f4f1ff; --dim:#a9a3d6; --night:#060818; --panel:rgba(14,12,40,.86); --line:rgba(190,170,255,.22);

  text-shadow: 0 3px 0 rgba(0,0,0,.5), 0 0 18px currentColor; animation: popup .8s ease-out forwards; will-change: transform, opacity; }
